# Publish a release to PyPI with Trusted Publishing (no stored token).
#
# One-time setup on pypi.org -> Account -> Publishing -> "Add a new pending publisher":
#   PyPI project name:  open-source-repository-sampler
#   Owner:              officefloor
#   Repository name:    open-source-repository-sampler
#   Workflow name:      publish.yml
#   Environment name:   pypi
#
# Then release by creating a vMAJOR.MINOR.PATCH tag on a commit of main and pushing it:
#   git tag -a v0.1.0 -m "open-source-repository-sampler 0.1.0" && git push origin v0.1.0
# The version comes ONLY from that tag: setuptools-scm reads it at build time, so it is never
# written in the code. (A failed run can be re-run, or this workflow run by hand on the tag.)
name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # setuptools-scm stamps the version and commit from git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse anything but a vMAJOR.MINOR.PATCH tag on main
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) echo "::error::run on a release tag, not $GITHUB_REF"; exit 1 ;;
          esac
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - name: Check the built version is the tag
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          ls dist/
          ls "dist/open_source_repository_sampler-${want}-py3-none-any.whl" \
             "dist/open_source_repository_sampler-${want}.tar.gz" >/dev/null \
            || { echo "::error::built version is not $want"; exit 1; }
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write             # the OIDC token PyPI trusts in place of a password
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of an already-published version is a no-op, not a failure.
          skip-existing: true
